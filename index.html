<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>my-blog</title>
  <meta name="description" content="마크다운으로 쓰는 블로그">
  <meta name="theme-color" content="#05060a">
  <link rel="stylesheet" href="css/base.css">

</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-bar">
    <div class="container container-wide bar-inner">
      <a class="site-mark" href="index.html">my-blog</a>
